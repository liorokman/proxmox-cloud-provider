grpc:
  listen: 0.0.0.0
  port: 9999
  auth:
    key: certs/lbmanager-dev.pem
    cert: certs/lbmanager-dev.pem
    ca: certs/ca.pem
dbDir: /tmp/db
loadbalancer:
  namespace: LB
  externalInterface: dummy0
  internalInterface: eth1
  ipam:
    # Simple IPAM
    
    # cidr is the network in which this IPAM operates
    cidr: 192.168.87.0/24
    # dynamicRange is the range from which LB addresses are taken when
    # a Service doesn't ask for a specific one. A specific address can also
    # be requested from this range. The entire range must be contained
    # in the cidr.
    dynamicRange:
      startAt: 192.168.87.200
      endAt:  192.168.87.225
    # staticRange (optional) holds more addresses that can only be requested
    # explicitly (loadBalancerIP). Addresses outside both ranges are refused,
    # so a Service can never claim the router's or another host's address.
    # Exclude both ranges from the LAN's DHCP server.
    staticRange:
      startAt: 192.168.87.230
      endAt: 192.168.87.240
