
syntax = "proto3";
import "google/protobuf/empty.proto";

option go_package = "github.com/liorokman/proxmox-cloud-provider/internal/loadbalancer";

package loadbalancer;

service LoadBalancer {
   // Get all information about all defined Load Balancers
   rpc GetLoadBalancers(google.protobuf.Empty) returns (stream LoadBalancerInformation);
   // Get information about a specific Load Balancer. If no such name exists, return
   // an empty structure
   rpc GetLoadBalancer(LoadBalancerName) returns (LoadBalancerInformation);

   rpc Create(CreateLoadBalancer) returns (LoadBalancerInformation);
   rpc Delete(LoadBalancerName) returns (Error);

   // Apply makes the named load balancer match the request: it is created if it
   // doesn't exist, targets that are missing are added and targets that are not
   // in the request are removed. Repeating the same request changes nothing.
   rpc Apply(ApplyRequest) returns (ApplyResult);

   rpc AddTarget(AddTargetRequest) returns (Error);
   rpc DelTarget(DelTargetRequest) returns (Error);
}

enum Protocol {
   TCP = 0;
   UDP = 1;
}

message Error {
   uint32 Code = 1;
   string Message = 2;
}

message LoadBalancerName {
   string name = 1;
}

message LoadBalancerInformation {
   string name = 1;
   string ip_addr = 2;
   map<int32,TargetList> targets = 3;
}

message CreateLoadBalancer {
   string name = 1;
   // If an ip_addr is requested, try to use it. Otherwise, an unused IP will be allocated.
   optional string ip_addr = 2;
}

message DelTargetRequest {
   string lb_name = 1;
   int32 srcPort = 2;
   Target target = 3;
}

message AddTargetRequest {
   string lb_name = 1;
   int32 srcPort = 2;
   Target target = 3;
}

message Target {
   Protocol protocol = 1;
   string dstIP = 2;
   int32 dstPort = 3;
   // If not zero, the target is health checked with an HTTP GET of /healthz on
   // this port (the healthCheckNodePort of Services with externalTrafficPolicy
   // Local); a 200 answer means healthy. Otherwise a TCP connect to dstPort is used.
   int32 healthCheckPort = 4;
}

message ApplyRequest {
   string name = 1;
   // If an ip_addr is requested, try to use it. Otherwise, an unused IP will be allocated.
   // It can't be changed once the load balancer exists.
   optional string ip_addr = 2;
   // The complete desired targets, by source port
   map<int32,TargetList> targets = 3;
}

message ApplyResult {
   LoadBalancerInformation info = 1;
   // Problems per source port. Ports that were applied cleanly are not listed.
   map<int32,string> port_errors = 2;
}

message TargetList {
   repeated Target target = 1;
}
